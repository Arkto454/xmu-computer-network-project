server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: campus-errand-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_errand?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
mybatis:
  configuration:
    map-underscore-to-camel-case: true
app:
  admin:
    token-ttl: 1h
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:管理员}
