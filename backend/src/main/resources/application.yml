server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: campus-errand-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_errand?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 200ms
      timeout: 200ms
  sql:
    init:
      mode: always
      platform: mysql
      encoding: UTF-8
mybatis:
  configuration:
    map-underscore-to-camel-case: true
app:
  task:
    cache:
      enabled: ${TASK_CACHE_ENABLED:true}
      ttl: 10s
      namespace: ${TASK_CACHE_NAMESPACE:campus-errand:hall:v1}
    delivery:
      window-ms: 1000
      scheduling-enabled: true
      fixed-delay-ms: 250
    claim:
      window-ms: 1000
      scheduling-enabled: true
      fixed-delay-ms: 250
    expiration:
      enabled: true
      fixed-delay-ms: 30000
  student:
    token-ttl: 1h
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  admin:
    token-ttl: 1h
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:管理员}
