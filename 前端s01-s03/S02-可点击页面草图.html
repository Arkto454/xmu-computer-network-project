<style>

*{box-sizing:border-box}body{margin:0;background:#e6ebe5;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b4722c;outline-offset:3px}button:disabled{cursor:default;opacity:.55}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-.6px}h2{font-size:20px;line-height:1.4}h3{font-size:17px}small,.small{font-size:14px}button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px}button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:650}button.danger{color:var(--danger);border-color:#ddbab7}.muted{color:var(--muted)}.warn{color:var(--warn)}.danger-text{color:var(--danger)}.stack{display:grid;gap:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:700;text-transform:uppercase;color:var(--green)}
.desk{max-width:1100px;margin:auto;padding:36px 28px;display:grid;grid-template-columns:minmax(250px,1fr) 390px;gap:64px;align-items:start}.guide{position:sticky;top:30px}.guide>p{margin-top:14px;max-width:520px}.stamp{border-top:4px solid var(--green);padding-top:18px;margin-bottom:28px}.settings{margin-top:30px;display:grid;gap:16px}.settings label{font-size:14px;display:grid;gap:6px}.settings select{width:100%;padding:10px;border:1px solid #b6c4ba;background:#fff;border-radius:6px;min-height:44px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{padding:14px 16px;border-left:3px solid var(--green);background:#f5f8f3;font-size:14px}.scope{margin-top:24px;font-size:14px}.scope li{margin-top:8px}.phone{background:var(--paper);border:1px solid #bac7bd;border-radius:20px;box-shadow:0 20px 54px #17332d16;overflow:hidden;min-width:0}.statusbar{height:31px;padding:5px 20px;background:white;font-size:12px;display:flex;justify-content:space-between;font-weight:650}.navbar{min-height:58px;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:50px 1fr 50px;align-items:center;padding:0 8px;text-align:center}.navbar h2{font-size:17px}.back{font-size:25px;padding:0;border:0}.screen{min-height:610px;position:relative;display:flex;flex-direction:column}.content{padding:20px 16px;flex:1;min-width:0}.content>*+*{margin-top:20px}.content h2,.content h3{overflow-wrap:anywhere}.brand{display:flex;align-items:center;gap:12px}.brandmark{border:2px solid var(--green);width:38px;height:38px;display:grid;place-items:center;color:var(--green);font-size:23px;border-radius:50%}.kicker{font-size:13px;letter-spacing:1.5px;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:14px;padding:6px 12px;border-radius:6px}.chip[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.task{background:white;border-top:2px solid var(--green);padding:18px 16px;display:block;text-align:left;width:100%;border-radius:3px;border-bottom:1px solid var(--line)}.task+.task{margin-top:14px}.reward{font-weight:750;color:var(--green);font-size:23px;white-space:nowrap}.reward small{font-size:12px;font-weight:400;display:block;text-align:right;color:var(--muted)}.route{margin-top:16px;display:grid;grid-template-columns:26px 1fr;gap:6px 10px;position:relative}.stop{font-size:12px;display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--green);border-radius:50%;color:var(--green)}.stop.end{background:var(--green);color:#fff}.route p{font-size:15px}.meta{margin-top:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.badge{font-size:13px;border:1px solid var(--line);padding:2px 8px;border-radius:4px;display:inline-block;background:white}.section{background:#fff;border:1px solid var(--line);padding:16px;border-radius:5px}.section p+p{margin-top:8px}.section h3{margin-bottom:12px}.full{width:100%}.actionbar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:white;border-top:1px solid var(--line);display:grid;gap:8px}.tabbar{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.tabbar button{flex:1;border:0;border-radius:0;color:var(--muted);font-size:12px;padding:12px 2px 9px;display:grid;justify-items:center;gap:4px}.tabbar button[aria-current=page]{color:var(--green);font-weight:750;background:#f1f6ef}.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}.field{display:grid;gap:6px;font-size:14px}.field input,.field textarea,.field select{width:100%;min-height:46px;border:1px solid #b5c2b9;border-radius:6px;background:#fff;padding:10px 12px}.field textarea{min-height:90px;resize:vertical}.field .hint{font-size:13px;color:var(--muted)}.timeline{padding:0;list-style:none;margin-bottom:0}.timeline li{position:relative;padding:0 0 18px 24px;font-size:14px;border-left:1px solid var(--line);margin-left:6px}.timeline li:before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;background:var(--green);border-radius:50%}.timeline li:last-child{padding-bottom:0;border:0}.timeline time{display:block;font-size:12px;color:var(--muted)}.menu button{display:flex;justify-content:space-between;border-radius:0;border-width:0 0 1px;width:100%;text-align:left;padding:16px 0;min-height:58px;background:transparent}.empty{text-align:center;padding:40px 8px}.empty p{margin:12px 0 22px}.codebox{height:220px;border:1px dashed #8a9e91;display:grid;place-items:center;text-align:center;background:#fff;color:var(--muted);padding:24px}.amount{font-size:36px;font-weight:750}.simlabel{color:var(--warn);font-size:13px;border-bottom:1px solid var(--line);padding:6px 16px;background:#fffaed}.footnote{font-size:13px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:12px;padding:24px;max-width:calc(100vw - 32px);width:380px;color:var(--ink)}dialog::backdrop{background:#102a2380}dialog p{margin:12px 0 20px}dialog .row{justify-content:flex-end}dialog h2{font-size:19px}.result{min-height:24px;font-size:14px;color:var(--warn)}
@media(max-width:760px){.desk{display:flex;flex-direction:column;padding:20px 12px;gap:22px;align-items:stretch}.guide{position:static}.stamp{margin-bottom:12px}.settings{margin-top:18px}.scope{display:none}.phone{width:100%;max-width:430px;align-self:center;border-radius:12px}.screen{min-height:580px}h1{font-size:23px}.guide>p{font-size:14px}.settings{grid-template-columns:1fr}.content{padding:18px 16px}}

<body><div class="desk">
<aside class="guide" aria-label="草图审阅工具">
 <div class="stamp"><p class="eyebrow">Campus Errand / S02</p><h1>校园里的事，顺路帮一程。</h1></div>
 <p>先看路线，再看任务。这份草图用来确认页面结构、入口和按钮权限，后续按计划逐步做成微信小程序。</p>
 <p class="note">设计演示 · 全部为虚构样例。不会发送请求、操作微信账号、扫码或产生收益。</p>
 <div class="settings">
  <label>查看页面<select id="pageSelect"></select></label>
  <div class="twocol"><label>详情中的身份<select id="role"><option value="other">其他学生</option><option value="publisher">发布者</option><option value="assignee">接单者</option></select></label><label>任务状态<select id="state"></select></label></div>
  <label>详情特殊情况<select id="condition"><option value="normal">正常</option><option value="unknown">接单结果待确认</option><option value="overdue">已超时（附加标记）</option><option value="guest">尚未登录</option></select></label>
 </div>
 <p class="note" id="designNote" style="margin-top:20px"></p>
 <ul class="scope"><li>底部只保留三个标签；发布通过大厅按钮进入。</li><li>页面返回保留来源；已发布任务不能编辑。</li><li>按钮按任务关系与服务端状态显示。</li><li>交付码只画占位，不生成假凭据。</li></ul>
 <p class="footnote" style="margin-top:24px">S02 · 页面草图 1.1 / 2026.11.14<br>不代表当前主工程已实现。</p>
</aside>
<main class="phone" aria-label="手机页面草图">
 <div class="statusbar"><span>9:41</span><span>微信小程序</span></div>
 <div class="navbar"><button id="back" class="back" aria-label="返回上一页">‹</button><h2 id="navTitle"></h2><span aria-hidden="true">···</span></div>
 <div class="simlabel">草图样例 · 非真实业务</div>
 <div class="screen"><div id="content" class="content"></div><div id="actions"></div><nav id="tabs" class="tabbar" aria-label="底部导航"></nav></div>
</main>
</div>
<dialog id="modal" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p id="modalBody"></p><div class="row"><button id="modalCancel">返回</button><button id="modalOk" class="primary">知道了</button></div></dialog>
<script>
const pages={hall:'P01 任务大厅',login:'P02 登录',publish:'P03 发布任务',detail:'P04 任务详情',tasks:'P05 我的任务',profile:'P06 我的',edit:'P07 个人资料',code:'P08 交付码',scan:'P09 扫码核对',earnings:'P10 模拟收益'};
const states=['待接单','已接单','已取件','待确认','已完成','已取消','已过期','已关闭'];
const $=id=>document.getElementById(id);let current='hall',history=[],listKind='我发布的',filter='全部',loginTarget='detail';
const sample={title:'帮取一份快递',from:'北门快递站',to:'第二教学楼',deadline:'今天 18:30',reward:'3.00'};
const notes={hall:'大厅先展示待接单任务。筛选、刷新和分页将在后续Mock阶段实现。',login:'登录后回原目标；不会自动执行接单等写操作。',publish:'自由填写地点；公开与私密信息分区，交接手机号按任务保存。字段上限待契约确认。',detail:'切换上方身份与状态检查权限。状态变化最终必须以后端为准。',tasks:'“我发布的”和“我承接的”只改变列表关系，不是两种固定账号角色。',profile:'模拟收益不是真实余额；不提供钱包或提现。',edit:'资料编辑后置，不作为发布或接单的前置条件；修改不影响已有任务交接快照。',code:'仅接单者、待确认状态可用。此处不生成真实或仿真的二维码。',scan:'仅发布者、待确认且有只读核验接口时使用。没有该接口时先确认再扫码提交。',earnings:'仅展示服务端模拟结算记录；不涉及真实交易。'};
for(const [key,name] of Object.entries(pages))$('pageSelect').add(new Option(name,key));for(const s of states)$('state').add(new Option(s,s));
function routeHtml(from=sample.from,to=sample.to){return `<div class="route"><span class="stop">取</span><p>${from}</p><span class="stop end">送</span><p>${to}</p></div>`}
function taskCard(title=sample.title,from=sample.from,to=sample.to){return `<button class="task" data-go="detail"><div class="row"><h3>${title}</h3><span class="reward">¥${sample.reward}<small>模拟奖励</small></span></div>${routeHtml(from,to)}<div class="meta"><span>${sample.deadline}前送达</span><span>${current==='hall'?'待接单':$('state').value}</span></div></button>`}
function btn(text,act,cls='primary'){return `<button class="${cls}" data-act="${act}">${text}</button>`}
function go(page,remember=true){if(page==='detail'&&current==='tasks'&&listKind==='我承接的'&&$('state').value==='待接单')$('state').value='已接单';if(remember&&page!==current)history.push(current);current=page;render()}
function back(){go(history.pop()||'hall',false)}
function message(title,body,ok='知道了',callback=null){$('modalTitle').textContent=title;$('modalBody').textContent=body;$('modalOk').textContent=ok;$('modalOk').onclick=()=>{$('modal').close();if(callback)callback()};$('modalCancel').hidden=!callback;$('modal').showModal()}
function tabs(){const icons=['<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>','<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v5H9zM8 12h8M8 16h6"/>','<circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>'];return ['hall','tasks','profile'].map((p,i)=>`<button data-tab="${p}" ${current===p?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[i]}</svg>${pages[p].slice(4)}</button>`).join('')}
function detailActions(){const state=$('state').value,role=$('role').value,condition=$('condition').value;
 if(condition==='guest')return btn('登录后操作','login');
 if(condition==='unknown'&&role==='other')return `<div class="note warn">接单结果待确认，请先找回原操作结果。</div>${btn('查原接单结果','recover')}`;
 if(state==='待接单'&&role==='publisher')return btn('取消任务','cancel','danger');
 if(state==='待接单'&&role==='other')return btn('接下这个任务','claim');
 if(state==='已接单'&&role==='assignee')return btn('确认已取件','pickup');
 if(state==='已取件'&&role==='assignee')return btn('申请交付','deliver');
 if(state==='待确认'&&role==='assignee')return '<button class="primary" data-go="code">展示交付码</button>';
 if(state==='待确认'&&role==='publisher')return btn('扫码确认','scan');
 if(state==='已完成'&&role==='assignee')return '<button class="primary" data-go="earnings">查看模拟收益</button>';
 return '<p class="small muted">当前身份无可推进的操作，可刷新查看最新进度。</p>';
}
function render(){let c='',a='';const state=$('state').value,role=$('role').value;const roleNames={other:'其他学生',publisher:'发布者',assignee:'接单者'};$('pageSelect').value=current;$('navTitle').textContent=pages[current].slice(4);$('back').style.visibility=['hall','tasks','profile'].includes(current)?'hidden':'visible';$('designNote').textContent=notes[current];$('tabs').innerHTML=['hall','tasks','profile'].includes(current)?tabs():'';
 if(current==='hall')c=`<div class="row"><div class="brand"><span class="brandmark" aria-hidden="true">↗</span><div><p class="kicker">校园互助</p><h2>今天，顺路帮个忙</h2></div></div></div><button class="primary full" data-act="publish">＋ 发布任务</button><div class="chips" aria-label="任务类型">${['全部','快递帮取','外卖帮取','资料帮取','轻量搬运','其他'].map(x=>`<button class="chip" data-filter="${x}" aria-pressed="${filter===x}">${x}</button>`).join('')}</div><div><div class="row" style="margin-bottom:12px"><h3>等你接单</h3><span class="small muted">虚构样例</span></div>${filter==='其他'?'<div class="empty"><h3>暂时没有这类任务</h3><p class="muted">换个类型看看，或发布自己的需求。</p></div>':filter==='资料帮取'?taskCard('帮带一份文具','校内文具店','图书馆'):taskCard()}${filter==='全部'?taskCard('帮带一份文具','校内文具店','图书馆'):''}</div><p class="footnote">仅展示任务必要信息；联系方式不会公开在大厅。</p>`;
 if(current==='login'){c=`<div class="empty"><span class="brandmark" style="margin:0 auto 24px" aria-hidden="true">↗</span><h2>登录，开始校园互助</h2><p class="muted">登录后可以发布、接单和查看自己的任务。必要资料在需要时提示完善。</p>${btn('微信登录（草图演示）','loginDemo')}<p class="footnote">实际登录将由微信与后端共同验证。</p><button data-act="back">暂不登录</button></div>`}
 if(current==='publish'){c=`<div class="note">奖励为模拟金额；发布后不能修改。地点自由填写，房间、取件码和手机号勿写在公开区域；不要求先编辑个人资料。</div><form id="publishForm" class="stack"><label class="field">任务类型<select required><option>快递帮取</option><option>外卖帮取</option><option>资料帮取</option><option>轻量搬运</option><option>其他</option></select></label><label class="field">任务标题<input required value="帮取一份快递"></label><label class="field">普通任务说明（选填，公开）<textarea>请在截止时间前送到约定地点，谢谢。</textarea></label><label class="field">取件地点（必填，公开）<input required value="北门快递站" placeholder="自由填写校区或建筑区域"></label><label class="field">送达地点（必填，公开）<input required value="第二教学楼门口" placeholder="自由填写公开交接区域"></label><label class="field">最晚送达时间<input required type="datetime-local" value="2026-11-15T18:30"><span class="hint">草图日期为样例，正式时间规则由后端确认。</span></label><label class="field">模拟奖励（元）<input required type="number" min="0.01" step="0.01" value="3.00"></label><div class="note">以下为本次任务私密信息。不会向无关浏览者返回；仅用测试内容，草图不保存输入。</div><label class="field">本次手机号（必填，非公开）<input required type="tel" placeholder="基本格式校验，不做短信认证"></label><label class="field">本次微信号（选填，非公开）<input placeholder="补充交接方式"></label><label class="field">私密交接说明（选填）<textarea placeholder="取件码、详细房间或特殊交接要求"></textarea></label><button class="primary" type="submit">发布任务（草图演示）</button></form>`}
 if(current==='detail'){const progress=['待接单','已接单','已取件','待确认','已完成'],idx=progress.indexOf(state);c=`<div class="row"><span class="badge">${state}${$('condition').value==='overdue'?' · 已超时':''}</span><span class="small muted">你是${roleNames[role]}</span></div><div class="row"><h2>${sample.title}</h2><span class="reward">¥3.00<small>模拟奖励</small></span></div><section class="section">${routeHtml()}<p class="small muted" style="margin-top:16px">${sample.deadline}前送达</p></section><section class="section"><h3>任务说明</h3><p>请在截止时间前送到约定地点，谢谢。</p><p class="small muted">未结束任务仅发布者与成功接单者可查看本次交接信息。结束后默认隐藏完整手机号，历史私密说明规则待定。</p></section>${state==='已关闭'?'<div class="note danger-text"><b>管理员已关闭任务</b><p>原因样例：发布内容不符合要求。任务停止推进，不产生模拟结算。</p></div>':['已取消','已过期'].includes(state)?`<div class="note">任务${state}，不可继续接单或交付。</div>`:`<section class="section"><h3>任务进度</h3><ol class="timeline">${progress.slice(0,Math.max(1,idx+1)).map((s,i)=>`<li>${s}<time>样例进度 ${i+1}</time></li>`).join('')}</ol></section>`}<p class="footnote">实际状态、时间和按钮权限，以服务端最新数据为准。</p>`;a=`<div class="actionbar">${detailActions()}${btn('刷新详情','refresh','')}</div>`}
 if(current==='tasks')c=`<div class="chips">${['我发布的','我承接的'].map(x=>`<button class="chip" data-kind="${x}" aria-pressed="${listKind===x}">${x}</button>`).join('')}</div><p class="small muted">${listKind} · 全部状态（样例）</p>${taskCard()}<p class="footnote">后续支持状态筛选、下拉刷新与分页；这里先确定任务入口。</p>`;
 if(current==='profile')c=`<div class="brand"><span class="brandmark" aria-hidden="true">同</span><div><h2>校园同学 A</h2><p class="small muted">当前账号 · 资料待确认</p></div></div><div class="section"><h3>互助，从一段顺路开始</h3><p class="small muted">你可以发布自己的需求，也可以承接其他同学的任务。</p></div><div class="menu"><button data-go="edit">个人资料 <span>›</span></button><button data-go="earnings">模拟收益 <span>›</span></button></div><button class="full" data-act="logout">退出登录</button><p class="footnote">草图不读取真实微信账号信息。</p>`;
 if(current==='edit')c=`<div class="note">资料修改尚未实现，也不是发布或接单前置；任务按本次联系方式保存，资料变化不回写历史任务。</div><form id="editForm" class="stack"><label class="field">昵称（示意）<input required value="校园同学 A"></label><label class="field">联系方式（示意）<input placeholder="待确认字段及可见范围" disabled><span class="hint">不在大厅公开；具体参与者可见范围由后端控制。</span></label><button type="submit" class="primary">保存资料（草图演示）</button></form>`;
 if(current==='code'){const allowed=role==='assignee'&&state==='待确认';c=allowed?`<div><h2>${sample.title}</h2><p class="muted">送达：${sample.to}</p></div><div class="codebox"><div><b>交付码区域</b><p class="small">正式版本显示服务端短时凭据<br>此处没有可扫描的二维码</p></div></div><p class="small muted">有效期由服务端提供；到期后清除旧码。</p><div class="note">请发布者从该任务详情扫码确认。倒计时结束不会自动完成任务。</div>`:'<div class="empty"><h2>当前无法展示交付码</h2><p>仅接单者在待确认状态下可用。</p></div>';a=`<div class="actionbar">${allowed?btn('刷新交付码（示意）','refreshCode'):''}<button data-go="detail">返回任务详情</button></div>`}
 if(current==='scan'){const allowed=role==='publisher'&&state==='待确认';c=allowed?`<div class="note">只读核验成功后的样例。草图没有调起相机，也没有核验任何凭据。</div><section class="section stack"><h2>请核对这次交付</h2><p>${sample.title}</p>${routeHtml()}<p>接单者：校园同学 B（样例）</p><p class="small muted">任务与扫描凭据一致后才能确认。确认完成将结束任务并触发模拟结算。</p></section>`:'<div class="empty"><h2>当前无法确认交付</h2><p>仅发布者在待确认状态下可用。</p></div>';a=`<div class="actionbar">${allowed?btn('确认完成（草图演示）','confirm'):''}<button data-go="detail">取消并返回详情</button></div>`}
 if(current==='earnings')c=`<div class="note">仅模拟结算，不涉及真实支付。</div><section class="section"><p class="muted small">累计模拟收益（样例）</p><p class="amount">¥ 3.00</p><p class="small muted">只计服务端确认完成并结算的任务。</p></section><div><h3>模拟结算记录</h3><div class="section" style="margin-top:12px"><div class="row"><b>帮取一份快递</b><b>＋3.00</b></div><p class="small muted">样例记录 · 已完成</p></div></div><p class="footnote">没有充值、提现或钱包功能。</p>`;
 if($('condition').value==='guest'&&['tasks','profile','code','scan'].includes(current)){c='<div class="empty"><h2>登录后查看</h2><p class="muted">登录后可以查看自己的任务、资料和交付信息。</p>'+btn('去登录','login')+'</div>';a=''}
 $('content').innerHTML=c;$('actions').innerHTML=a;
 if($('publishForm'))$('publishForm').onsubmit=e=>{e.preventDefault();message('发布路径演示','这里没有提交表单。正式发布明确成功后，使用返回的任务编号进入详情，防止返回后重复发布。','查看样例详情',()=>{$('role').value='publisher';$('state').value='待接单';history=history.filter(x=>x!=='publish');go('detail',false)})};
 if($('editForm'))$('editForm').onsubmit=e=>{e.preventDefault();message('资料保存路径','这里不会保存资料。正式保存成功后应重查用户信息与操作资格。','返回我的',()=>go('profile'))};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){history=[];go(b.dataset.tab,false)}else if(b.dataset.go){if(b.dataset.go==='detail'&&current==='hall'){$('state').value='待接单';if($('role').value==='assignee')$('role').value='other'}if(b.dataset.go==='detail'&&current==='tasks')$('role').value=listKind==='我发布的'?'publisher':'assignee';go(b.dataset.go)}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.kind){listKind=b.dataset.kind;render()}else if(b.dataset.act){act(b.dataset.act)}});
function act(x){if(x==='back')return back();if(x==='publish'){if($('condition').value==='guest'){loginTarget='publish';return go('login')}return go('publish')}if(x==='login'){loginTarget=current;return go('login')}if(x==='loginDemo')return message('登录返回路径','没有实际调用微信登录。正式登录成功后回到原目标，仍需你确认接单或发布。','回到原目标',()=>{$('condition').value='normal';go(loginTarget,false)});if(x==='scan')return message('扫码前确认','真实交互将调用微信扫码；有只读核验接口时先展示核对页，只有不可逆确认接口时在这里先明确确认。','查看核对页样例',()=>go('scan'));if(x==='logout')return message('退出登录','正式退出会清理账号相关页面、连接与交付码。这里仅演示退出后的入口。','退出样例会话',()=>{$('condition').value='guest';loginTarget='profile';go('login')});
 const messages={claim:['确认接单','正式版本先填写或确认本次手机号（必填）和微信号（选填），再发送一次带请求编号的接单。失败不登记交接关系、不开放私密信息。草图不发请求。'],cancel:['取消这个任务？','仅待接单发布者可取消。正式版本由后端确认结果后刷新详情；此处不会取消。'],pickup:['确认已经取到物品？','正式版本确认取件后才更新进度；这里仅展示操作位置。'],deliver:['申请交付','正式版本申请成功后进入待确认，再获取服务端交付码。此处不推进状态。'],confirm:['确认任务已完成？','正式版本将提交确认并查询最新详情；这里不会完成任务或增加模拟收益。'],recover:['找回原接单结果','正式版本使用同一账号和原请求编号查询，查不到仍保持待确认；本草图没有查询接口。'],refresh:['刷新详情','正式版本将重新请求服务端；这里保留你在审阅工具选择的状态。'],refreshCode:['刷新交付码','正式版本根据任务状态获取新凭据并废弃旧码。草图不生成凭据。']};if(messages[x])message(...messages[x]);}
$('pageSelect').onchange=e=>go(e.target.value);$('role').onchange=()=>{if($('role').value==='assignee'&&$('state').value==='待接单')$('state').value='已接单';go('detail',false)};$('state').onchange=()=>{if($('state').value==='待接单'&&$('role').value==='assignee')$('role').value='other';go('detail',false)};$('condition').onchange=()=>go('detail',false);$('back').onclick=back;$('modalCancel').onclick=()=>$('modal').close();render();
</script></body></html>
